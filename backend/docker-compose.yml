services:
  postgres:
    image: postgres:17-alpine
    container_name: vizualizator-postgres
    environment:
      POSTGRES_DB: vizualizator
      POSTGRES_USER: vizualizator
      POSTGRES_PASSWORD: vizualizator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
