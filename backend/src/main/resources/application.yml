spring:
  application:
    name: vizualizator
  datasource:
    url: jdbc:postgresql://localhost:5432/vizualizator
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  storage:
    base-path: ${user.home}/.vizualizator/storage
    public-base-url: /api/files
  cors:
    allowed-origins:
      - http://localhost:3000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
